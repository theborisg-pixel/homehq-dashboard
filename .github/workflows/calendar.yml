name: Sync calendar
# Publishes upcoming events from the family calendar as calendar.json for the dashboard.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund ical-expander@3.2.0
      - run: node .github/scripts/sync-calendar.mjs calendar.json
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
      - name: Publish if changed
        run: |
          git add calendar.json
          if git diff --cached --quiet; then echo "No calendar changes."; exit 0; fi
          git -c user.name="calendar-sync" -c user.email="actions@users.noreply.github.com" commit -q -m "Update calendar"
          git pull -q --rebase
          git push -q
